services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      UPLOAD_DIR: /app/storage
    ports: ["8000:8000"]
    volumes: [document_storage:/app/storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      ollama: {condition: service_started}
  worker:
    build: ./backend
    command: celery -A app.workers.celery worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      UPLOAD_DIR: /app/storage
    volumes: [document_storage:/app/storage]
    depends_on: [backend, redis, db, ollama]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  ollama_data:
  document_storage:
